{% extends "base.html" %}

{% block title %}Apps - LabBox Admin{% endblock %}

{% block content %}
<h1>Configured Apps</h1>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Resources</th>
            </tr>
        </thead>
        <tbody>
            {% for app_id, app in apps.items() %}
            <tr>
                <td><code>{{ app_id }}</code></td>
                <td>{{ app.title }}</td>
                <td>{{ app.description or '-' }}</td>
                <td>{{ app.resources|length }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
