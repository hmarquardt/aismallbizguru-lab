<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LabBox Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin.css?v=20260511-ajax-crud">
</head>
<body>
    <nav>
        <a href="/admin/">Dashboard</a>
        <a href="/admin/apps">Apps</a>
        <a href="/admin/records">Records</a>
        <a href="/admin/files">Files</a>
        <a href="/admin/proxy-sources">Proxy Sources</a>
        <a href="/admin/tokens">Tokens</a>
        <a href="/admin/backups">Backups</a>
        <form method="post" action="/admin/logout">
            <button type="submit">Logout</button>
        </form>
    </nav>
    <main>
        <div id="admin-status" class="admin-status" role="status" aria-live="polite"></div>
        {% block content %}{% endblock %}
    </main>
    <div class="json-modal" id="json-modal" aria-hidden="true">
        <div class="json-modal__backdrop" data-json-close></div>
        <section class="json-modal__panel" role="dialog" aria-modal="true" aria-labelledby="json-modal-title">
            <div class="json-modal__header">
                <h2 id="json-modal-title">JSON</h2>
                <button class="icon-btn" type="button" data-json-close aria-label="Close">&times;</button>
            </div>
            <pre class="json-modal__body"><code id="json-modal-code"></code></pre>
        </section>
    </div>
    <script>
    (function () {
        const modal = document.getElementById("json-modal");
        const code = document.getElementById("json-modal-code");
        const statusBox = document.getElementById("admin-status");

        function escapeHtml(value) {
            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function highlight(jsonText) {
            const escaped = escapeHtml(jsonText);
            return escaped.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function (match) {
                    let cls = "json-number";
                    if (match.startsWith('"')) {
                        cls = match.endsWith(":") ? "json-key" : "json-string";
                    } else if (match === "true" || match === "false") {
                        cls = "json-boolean";
                    } else if (match === "null") {
                        cls = "json-null";
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        function openJson(button) {
            if (!modal || !code) return;
            const label = button.getAttribute("data-json-title") || "JSON";
            const raw = button.getAttribute("data-json") || "{}";
            let pretty = raw;
            try {
                pretty = JSON.stringify(JSON.parse(raw), null, 2);
            } catch (_error) {
                pretty = raw;
            }
            document.getElementById("json-modal-title").textContent = label;
            code.innerHTML = highlight(pretty);
            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
        }

        function closeJson() {
            if (!modal || !code) return;
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            code.textContent = "";
        }

        document.addEventListener("click", function (event) {
            const opener = event.target.closest("[data-json]");
            if (opener) {
                openJson(opener);
                return;
            }
            if (event.target.closest("[data-json-close]")) {
                closeJson();
            }
        });
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeJson();
            }
        });

        function showStatus(message, type) {
            if (!statusBox) return;
            statusBox.textContent = message;
            statusBox.className = "admin-status is-visible " + (type || "status-info-bg");
        }

        function clearStatus() {
            if (!statusBox) return;
            statusBox.textContent = "";
            statusBox.className = "admin-status";
        }

        async function submitAjaxForm(form, submitter) {
            const response = await fetch(form.action, {
                method: form.method || "POST",
                body: new FormData(form),
                headers: {"X-Requested-With": "XMLHttpRequest"},
            });
            let payload = {};
            try {
                payload = await response.json();
            } catch (_error) {
                payload = {message: response.ok ? "Saved" : "Request failed"};
            }
            if (!response.ok || payload.ok === false) {
                throw new Error(payload.message || "Request failed");
            }

            showStatus(payload.message || "Saved", "status-ok-bg");

            if (payload.token) {
                const tokenBox = document.getElementById("new-token-inline");
                const tokenValue = document.getElementById("new-token-value");
                if (tokenBox && tokenValue) {
                    tokenValue.textContent = payload.token;
                    tokenBox.hidden = false;
                }
                form.reset();
            }

            if (form.dataset.ajaxRemove === "row") {
                form.closest("tr")?.remove();
            }

            if (form.dataset.ajaxDisableSubmit === "true" && submitter) {
                submitter.disabled = true;
            }

            if (form.dataset.ajaxClearFile === "true") {
                const input = form.querySelector('input[type="file"]');
                if (input) input.value = "";
            }

            if (form.dataset.ajaxLocationTarget && payload.location) {
                const target = document.querySelector(form.dataset.ajaxLocationTarget);
                if (target) {
                    target.href = payload.location;
                    target.hidden = false;
                }
            }
        }

        document.addEventListener("submit", async function (event) {
            const form = event.target.closest("form[data-ajax]");
            if (!form) return;
            event.preventDefault();
            clearStatus();
            const submitter = event.submitter;
            const originalText = submitter ? submitter.textContent : "";
            if (submitter) {
                submitter.disabled = true;
                submitter.textContent = "Working...";
            }
            try {
                await submitAjaxForm(form, submitter);
            } catch (error) {
                showStatus(error.message || "Request failed", "status-error-bg");
            } finally {
                if (submitter && form.dataset.ajaxDisableSubmit !== "true") {
                    submitter.disabled = false;
                    submitter.textContent = originalText;
                }
            }
        });
    })();
    </script>
</body>
</html>
